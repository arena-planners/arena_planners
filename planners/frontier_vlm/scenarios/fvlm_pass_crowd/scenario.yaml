# frontier_vlm: dense two-way traffic in the central hallway (x 8-12) on the way to the laboratory.
# A slow pair ahead going the same way (overtake or wait), an oncoming pair side by side (do not
# split them), two people crossing between doors, a fast walker arriving late from the north.
# Tests R2 (keep right), R3 (do not cut through a group), progress in a crowd.
format: arena-scenario/2
robots:
- start: [10.0, 6.0, 1.5708]
  phases:
  - {goto: laboratory, pose: [14.5, 23.4, 0.0], tolerance_radius: 2.5, signal: arrived, text: "Go to the laboratory."}
humans:
# slow pair ahead, same direction, west half of the hallway
- name: slow_pair_a
  model: arenian
  pose: [9.2, 9.0, 1.5708]
  agent: {agent_type: elder, desired_velocity: 0.4}
  waypoints: [[9.2, 31.0], [9.2, 7.0]]
- name: slow_pair_b
  model: arenian
  pose: [9.8, 9.3, 1.5708]
  agent: {agent_type: elder, desired_velocity: 0.4}
  waypoints: [[9.8, 31.3], [9.8, 7.3]]
# oncoming pair side by side, east half
- name: oncoming_pair_a
  model: Hospital/doctor_male_caucasian_middleage
  pose: [10.7, 24.0, -1.5708]
  agent: {agent_type: adult, desired_velocity: 0.9}
  waypoints: [[10.7, 4.0], [10.7, 31.0]]
- name: oncoming_pair_b
  model: Hospital/nurse_female_caucasian_young
  pose: [11.3, 24.3, -1.5708]
  agent: {agent_type: adult, desired_velocity: 0.9}
  waypoints: [[11.3, 4.3], [11.3, 31.3]]
# crossers between the doors on both walls
- name: crosser_ward_or
  model: arenian
  pose: [8.5, 14.0, 0.3]
  agent: {agent_type: adult, desired_velocity: 0.8}
  waypoints: [[11.5, 17.3], [8.5, 14.0]]
  spawn_delay: 4.0
- name: crosser_sub_ward
  model: arenian
  pose: [11.6, 11.6, 2.0]
  agent: {agent_type: distracted, desired_velocity: 0.7}
  waypoints: [[8.5, 21.1], [11.6, 11.6]]
  spawn_delay: 8.0
# fast walker from the north, late
- name: fast_oncoming
  model: arenian
  pose: [10.2, 32.0, -1.5708]
  agent: {agent_type: hurried, desired_velocity: 1.3}
  waypoints: [[10.2, 4.0], [10.2, 32.0]]
  spawn_delay: 10.0
